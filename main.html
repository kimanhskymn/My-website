<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./header/header.css">
  <link rel="stylesheet" href="./navbar/navbar.css">
  <link rel="stylesheet" href="./footer/footer.css">

  <title>Landing Page</title>
</head>
<style>
  .carousel-inner img {
    height: 70vh;
  }

  .carousel-item {
    transition: opacity 0.4s ease-in-out;
  }

  .carousel-item:hover {
    opacity: 0.8;
  }
</style>

<body>
  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
    <!-- 1. Các dấu chấm chỉ số lượng slide ở dưới -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
        aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
        aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
        aria-label="Slide 3"></button>
    </div>

    <!-- 2. Phần chứa các slide hình ảnh bên trong -->
    <div class="carousel-inner">
      <!-- Slide 1 (Bắt buộc phải có class 'active' để hiển thị đầu tiên) -->
      <div class="carousel-item active">
        <img src="./image/landing page/ldp1.png" class="d-block w-100" alt="Slide 1">
      </div>
      <!-- Slide 2 -->
      <div class="carousel-item">
        <img src="./image/landing page/ldp2.png" class="d-block w-100" alt="Slide 2">
      </div>
      <!-- Slide 3 -->
      <div class="carousel-item">
        <img src="./image/landing page/ldp3.png" class="d-block w-100" alt="Slide 3">
      </div>
    </div>

    <!-- 3. Nút bấm qua lại trái/phải -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
      data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
      data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div id="detail-placeholder"></div>
  <div id="footer-placeholder"></div>

  <!-- JavaScript -->
  <script src="./bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('header/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading header:', error));
  </script>

  <script>
    fetch('detail/detail.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('detail-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading detail:', error));
  </script>

  <script>
    fetch('navbar/navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading navbar:', error));
  </script>

  <script>
    fetch('footer/footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      })
      .catch(error => console.error('Error loading footer:', error));
  </script>

</body>

</html>
