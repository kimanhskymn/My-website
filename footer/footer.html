<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/footer/footer.css">
    <link rel="stylesheet" href="/bootstrap-icons-1.13.1/bootstrap-icons.min.css">
    <title>Footer</title>
</head>

<body>
    <div class="footer-container">
        <div class="footer-top">
            <div class="footer-box">
                <div class="footer-contact">
                    <div class="footer-title">
                        <i>liên hệ với <span>CHÚNG TÔI</span></i>
                    </div>
                    <div class="footer-line"></div>
                    <div class="footer-note">
                        <p>Hãy để lại những câu hỏi của bạn — bằng điện thoại hoặc email.</p>
                    </div>
                    <div class="footer-icon">
                        <div class="footer-scmd">
                            <i class="bi bi-telephone-fill"></i>
                        </div>
                        <div class="footer-scmd">
                            <i class="bi bi-envelope-fill"></i>
                        </div>
                    </div>
                </div>

                <div class="footer-newsfeed">
                    <div class="footer-title">
                        <i><span>BẢNG TIN </span>của chúng tôi</i>
                    </div>
                    <div class="footer-line"></div>
                    <div class="footer-note">

                    </div>
                    <div class="ft-button">
                        <button><a href="">NHẤP VÀO ĐÂY</a></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-bot">
            <div class="footer-policy">
                <ul>
                    <li><a href="">Về chúng tôi</a></li>
                    <li><a href="">Chính sách bảo mật</a></li>
                    <li><a href="">Điều khoản và điều kiện</a></li>
                </ul>
            </div>

            <div class="footer-line"></div>

            <div class="footer-social">
                <!-- facebook, ins, youtube, in, zalo -->
                <div class="footer-scmd"><a href=""><i class="bi bi-facebook"></i></a></div>
                <div class="footer-scmd"><a href=""><i class="bi bi-instagram"></i></a></div>
                <div class="footer-scmd"><a href=""><i class="bi bi-linkedin"></i></a></div>
            </div>

            <div class="footer-copyright">
                <p>©2026 Satomi. All rights reserved.</p>
            </div>
        </div>
    </div>

</html>
